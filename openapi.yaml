        movimentacoes:
          type: array
          description: "Uma movimentação por lote criado (entrada) ou consumido (saí\
            da, FIFO)"
          items:
            $ref: "#/components/schemas/MovimentacaoResponse"
        quantidadeAtual:
          type: integer
          format: int32
          description: Saldo do produto após a movimentação
    FotoResponse:
      type: object
      properties:
        url:
          type: string
          description: URL relativa da foto salva
          example: /arquivos/3f2a....png
    ItemVendaRequest:
      type: object
      properties:
        produtoEventoId:
          type: integer
          format: int64
          description: ID do item no cardápio do evento
          example: 7
        quantidade:
          type: integer
          format: int32
          description: Quantidade vendida
          example: 3
          minimum: 0
      required:
      - produtoEventoId
      - quantidade
    VendaRequest:
      type: object
      properties:
        valorFinal:
          type: number
          description: "Valor final cobrado (opcional), entre 0 e o total dos itens\
            \ já com o desconto unitário. O desconto da venda é total - valorFinal"
          example: 25.0
          minimum: 0
        itens:
          type: array
          description: "Itens da venda, ao menos um, sem produto repetido"
          items:
            $ref: "#/components/schemas/ItemVendaRequest"
          minItems: 1
      required:
      - itens
    VendaResponse:
      type: object
      description: Representação resumida da venda recém-registrada.
      properties:
        id:
          type: integer
          format: int64
          description: Identificador da venda.
        criadoEm:
          type: string
          format: date-time
          description: Data e hora em que a venda foi registrada em ISO-8601.
        desconto:
          type: number
          description: Desconto aplicado ao valor total da venda.
        precoTotal:
          type: number
          description: Valor total cobrado pela venda.
    FotoEventoResponse:
      type: object
      properties:
        url:
          type: string
          description: URL relativa da foto salva
          example: /arquivos/3f2a....png
    CaixaRequest:
      type: object
      properties:
        tipo:
          type: string
          description: Tipo do lançamento. QUITACAO_FIADO não é aceito neste endpoint
          enum:
          - VENDA_FICHA
          - DEVOLUCAO_FICHA
          example: VENDA_FICHA
        valor:
          type: number
          description: "Valor das fichas, maior que 0, com até 2 casas decimais"
          example: 50.0
          minimum: 0
        formaPagamento:
          type: string
          description: Forma de pagamento. FIADO só é aceito em VENDA_FICHA
          enum:
          - PIX
          - DEBITO
          - CREDITO
          - DINHEIRO
          - FIADO
          example: PIX
        nomeDevedor:
          type: string
          description: Nome do devedor. Obrigatório com FIADO; ignorado nas demais
            formas
          example: Maria
          maxLength: 150
          minLength: 0
        observacao:
          type: string
          description: Observação do fiado (opcional)
          example: paga no próximo evento
          maxLength: 255
          minLength: 0
      required:
      - formaPagamento
      - tipo
      - valor
    LancamentoResponse:
      type: object
      description: Representação de um lançamento de caixa.
      properties:
        id:
          type: integer
          format: int64
          description: Identificador do lançamento.
        tipo:
          type: string
          description: "Tipo do lançamento, como venda ou devolução de fichas."
          enum:
          - VENDA_FICHA
          - DEVOLUCAO_FICHA
          - QUITACAO_FIADO
        valor:
          type: number
          description: Valor do lançamento em reais.
        formaPagamento:
          type: string
          description: Forma de pagamento utilizada.
          enum:
          - PIX
          - DEBITO
          - CREDITO
          - DINHEIRO
          - FIADO
        nomeDevedor:
          type: string
          description: "Nome do devedor quando o lançamento corresponde a uma venda\
            \ fiada; caso contrário, pode ser nulo."
        criadoEm:
          type: string
          format: date-time
          description: Data e hora de criação do lançamento em ISO-8601.
    RegistroCaixaResponse:
      type: object
      description: Resultado do registro de um lançamento de caixa.
      properties:
        lancamento:
          $ref: "#/components/schemas/LancamentoResponse"
          description: Lançamento de caixa registrado.
        resumo:
          $ref: "#/components/schemas/ResumoCaixaResponse"
          description: Resumo financeiro atualizado do caixa.
    ResumoCaixaResponse:
      type: object
      description: Resumo financeiro dos lançamentos de caixa de um evento.
      properties:
        fichasVendidas:
          type: number
          description: Valor total recebido pela venda de fichas.
        fichasDevolvidas:
          type: number
          description: Valor total devolvido pela devolução de fichas.
        saldoFichas:
          type: number
          description: "Saldo de fichas, calculado pelas vendas menos as devoluçõ\
            es."
        porFormaPagamento:
          type: object
          additionalProperties:
            type: number
          description: Totais agrupados por forma de pagamento.
        fiadosEmAberto:
          type: number
          description: Valor total dos fiados ainda não quitados.
        quantidadeFiadosEmAberto:
          type: integer
          format: int64
          description: Quantidade de fiados ainda não quitados.
        totalRecebido:
          type: number
          description: Valor total recebido no caixa.
    DoacaoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        eventoId:
          type: integer
          format: int64
        tipo:
          type: string
          enum:
          - DINHEIRO
          - PRODUTO
          - REABASTECIMENTO
        valor:
          type:
          - number
          - "null"
          description: Preenchido só em DINHEIRO
        formaPagamento:
          type:
          - string
          - "null"
          description: Preenchido só em DINHEIRO
          enum:
          - PIX
          - DEBITO
          - CREDITO
          - DINHEIRO
        produtoId:
          type:
          - integer
          - "null"
          format: int64
          description: Preenchido só em REABASTECIMENTO
        nome:
          type:
          - string
          - "null"
          description: Descrição do item (PRODUTO) ou nome do produto (REABASTECIMENTO)
        quantidade:
          type:
          - integer
          - "null"
          format: int32
          description: Preenchido só em REABASTECIMENTO
        doador:
          type: string
        valorFicha:
          type:
          - number
          - "null"
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time
    RefreshTokenRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Refresh token recebido no login ou na última renovação
          minLength: 1
      required:
      - refreshToken
    RefreshTokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: Novo access token
        refreshToken:
          type: string
          description: Novo refresh token. O anterior é revogado (rotação)
    RedefinicaoSenhaRequest:
      type: object
      properties:
        token:
          type: string
          description: Token recebido por e-mail (64 caracteres hexadecimais)
          minLength: 1
        novaSenha:
          type: string
          description: "Nova senha, de 8 a 255 caracteres"
          example: NovaSenha@987
          maxLength: 255
          minLength: 8
      required:
      - novaSenha
      - token
    RecuperacaoSenhaRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: "E-mail da conta. A resposta é sempre 202, exista o e-mail\
            \ ou não"
          example: admin@email.com
          maxLength: 255
          minLength: 0
      required:
      - email
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          description: Refresh token a ser revogado
          minLength: 1
      required:
      - refreshToken
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: E-mail da conta
          example: admin@email.com
          maxLength: 255
          minLength: 0
        senha:
          type: string
          description: Senha da conta
          example: Senha@12345
          maxLength: 255
          minLength: 0
      required:
      - email
      - senha
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: "JWT de curta duração, enviado em Authorization: Bearer"
        refreshToken:
          type: string
          description: Token opaco para renovar a sessão. Só o hash é persistido
        usuario:
          $ref: "#/components/schemas/UsuarioResponse"
    UsuarioResponse:
      type: object
      description: Dados do usuário autenticado
      properties:
        nome:
          type: string
          example: admin
        cargo:
          type: string
          example: ADMINISTRADOR
        permissoes:
          type: array
          description: Permissões concedidas pelo cargo
          example:
          - EVENTOS_MENU
          - ESTOQUE_MENU
          items:
            type: string
    AlteracaoStatusEventoRequest:
      type: object
      properties:
        status:
          type: integer
          format: int32
          description: "ID do novo status (1 NAO_INICIADO, 2 EM_ANDAMENTO, 3 ENCERRADO)"
          example: 3
        custos:
          type: array
          description: "Custos adicionais (limpeza, ajudantes etc.). Só aceitos na\
            \ transição para ENCERRADO"
          items:
            $ref: "#/components/schemas/CustoEventoRequest"
      required:
      - status
    DescontoRequest:
      type: object
      properties:
        novoPreco:
          type: number
          description: "Novo preço unitário, entre 0 e o preço de venda do produto"
          example: 7.0
          minimum: 0
      required:
      - novoPreco
    DescontoProdutoResponse:
      type: object
      description: Dados do preço de venda do produto no evento após a aplicação ou
        remoção de desconto.
      properties:
        id:
          type: integer
          format: int64
          description: Identificador do produto no cardápio do evento.
        precoVenda:
          type: number
          description: Preço unitário original do produto no evento.
        desconto:
          type: number
          description: Valor do desconto aplicado por unidade.
        descontoAplicadoEm:
          type: string
          format: date-time
          description: Data e hora em que o desconto foi aplicado; nulo quando não
            há desconto aplicado.
        precoComDesconto:
          type: number
          description: Preço unitário após a aplicação do desconto.
    QuitacaoRequest:
      type: object
      properties:
        formaPagamento:
          type: string
          description: Forma usada na quitação. FIADO não é aceito (400)
          enum:
          - PIX
          - DEBITO
          - CREDITO
          - DINHEIRO
          example: DINHEIRO
      required:
      - formaPagamento
    FiadoResponse:
      type: object
      description: Resposta com os dados de um fiado registrado no caixa.
      properties:
        id:
          type: integer
          format: int64
          description: Identificador do fiado.
        nomeDevedor:
          type: string
          description: Nome da pessoa responsável pelo pagamento pendente.
        valor:
          type: number
          description: Valor do fiado em reais.
        observacoes:
          type: string
          description: Observações registradas para o fiado; pode ser nulo.
        quitado:
          type: boolean
          description: Indica se o fiado foi quitado.
        quitadoEm:
          type: string
          format: date-time
          description: Data e hora da quitação em ISO-8601; nulo enquanto pendente.
        formaPagamento:
          type: string
          description: Forma de pagamento utilizada na quitação; nula enquanto pendente.
          enum:
          - PIX
          - DEBITO
          - CREDITO
          - DINHEIRO
          - FIADO
        criadoEm:
          type: string
          format: date-time
          description: Data e hora de criação do lançamento em ISO-8601.
    QuitacaoResponse:
      type: object
      description: "Resultado da quitação de um fiado, incluindo o fiado atualizado,\
        \ o lançamento gerado e o resumo do caixa."
      properties:
        fiado:
          $ref: "#/components/schemas/FiadoResponse"
          description: Dados atualizados do fiado quitado.
        lancamento:
          $ref: "#/components/schemas/LancamentoResponse"
          description: Lançamento de caixa criado para registrar a quitação.
        resumo:
          $ref: "#/components/schemas/ResumoCaixaResponse"
          description: Resumo atualizado do caixa.
    TipoMovimentacaoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        codigo:
          type: string
          example: REABASTECIMENTO
        descricao:
          type: string
        direcao:
          type: string
          enum:
          - ENTRADA
          - SAIDA
        exigeCusto:
          type: boolean
          description: "Se true, a entrada exige custoTotal"
    PaginaResponseMovimentacaoResponse:
      type: object
      description: Página de resultados. page começa em 0
      properties:
        itens:
          type: array
          description: Registros da página
          items:
            $ref: "#/components/schemas/MovimentacaoResponse"
        page:
          type: integer
          format: int32
          description: "Índice da página, começando em zero"
          example: 0
        size:
          type: integer
          format: int32
          description: Tamanho da página
          example: 20
        totalItens:
          type: integer
          format: int64
          description: Total de registros
          example: 57
        totalPaginas:
          type: integer
          format: int32
          description: Total de páginas
          example: 3
    EstoqueResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        quantidadeInicial:
          type: integer
          format: int32
          description: Quantidade na entrada do lote
        quantidadeAtual:
          type: integer
          format: int32
          description: Saldo atual do lote. Lote zerado permanece como histórico
        custoUnitario:
          type: number
          description: "Custo por unidade. 0 em lotes sem custo (doação, ajuste)"
        custoTotal:
          type: number
          description: Valor pago pelo lote inteiro
        criadoEm:
          type: string
          format: date-time
          description: Data de entrada do lote
    EventoDetalheResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        observacoes:
          type:
          - string
          - "null"
        tipoEvento:
          type: string
          enum:
          - EVENTO
          - REUNIAO
        status:
          $ref: "#/components/schemas/StatusResumo"
        dataHoraInicio:
          type: string
          format: date-time
        dataHoraEncerramento:
          type: string
          format: date-time
        iniciadoEm:
          type:
          - string
          - "null"
          format: date-time
        encerradoEm:
          type:
          - string
          - "null"
          format: date-time
        resumo:
          $ref: "#/components/schemas/ResumoEvento"
    ResumoEvento:
      type: object
      properties:
        quantidadeProdutos:
          type: integer
          format: int64
          description: Itens no cardápio
        quantidadeVendas:
          type: integer
          format: int64
          description: Vendas não canceladas
        totalVendido:
          type: number
          description: Soma do preço total das vendas não canceladas
        totalCustosAdicionais:
          type: number
          description: Soma dos custos adicionais do evento
    CustoAdicionalRelatorio:
      type: object
      properties:
        nome:
          type: string
        descricao:
          type:
          - string
          - "null"
        valor:
          type: number
    DoacaoDinheiroRelatorio:
      type: object
      properties:
        doador:
          type: string
        valor:
          type: number
        formaPagamento:
          type: string
          enum:
          - PIX
          - DEBITO
          - CREDITO
          - DINHEIRO
        valorFicha:
          type:
          - number
          - "null"
    DoacaoItemRelatorio:
      type: object
      properties:
        tipo:
          type: string
          enum:
          - DINHEIRO
          - PRODUTO
          - REABASTECIMENTO
        produtoId:
          type:
          - integer
          - "null"
          format: int64
        nome:
          type: string
        quantidade:
          type:
          - integer
          - "null"
          format: int32
        doador:
          type: string
        valorFicha:
          type:
          - number
          - "null"
    DoacoesRelatorio:
      type: object
      properties:
        itens:
          type: array
          description: Doações de produto e de reabastecimento
          items:
            $ref: "#/components/schemas/DoacaoItemRelatorio"
        emDinheiro:
          type: array
          description: Doações em dinheiro
          items:
            $ref: "#/components/schemas/DoacaoDinheiroRelatorio"
        totalEmDinheiro:
          type: number
    MovimentacaoRelatorio:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tipo:
          type: string
          description: Código do tipo
          example: PERDA
        produtoId:
          type: integer
          format: int64
        produtoNome:
          type: string
        quantidade:
          type: integer
          format: int32
          description: Valor absoluto da quantidade movimentada
        custoUnitario:
          type: number
        custoTotal:
          type: number
        observacoes:
          type:
          - string
          - "null"
        criadoEm:
          type: string
          format: date-time
    ProdutoRanking:
      type: object
      properties:
        produtoEventoId:
          type: integer
          format: int64
        nome:
          type: string
        categoria:
          type:
          - string
          - "null"
        quantidadeVendida:
          type: integer
          format: int64
    ProdutoRelatorio:
      type: object
      properties:
        produtoEventoId:
          type: integer
          format: int64
        nome:
          type: string
        origem:
          type: string
          enum:
          - ESTOQUE
          - PRODUZIDO
        quantidadePrevista:
          type:
          - integer
          - "null"
          format: int32
          description: Nulo em itens PRODUZIDO
        quantidadeVendida:
          type: integer
          format: int64
        totalDescontos:
          type: number
          description: Soma de quantidade x descontoUnitario
        custoTotal:
          type: number
          description: "ESTOQUE: custo dos lotes consumidos nas vendas (lote sem custo\
            \ conta 0). PRODUZIDO: custo dos ingredientes"
        receitaVendas:
          type: number
          description: Soma de quantidade x (precoUnitario - descontoUnitario)
        lucroBruto:
          type: number
          description: "Total arrecadado do produto, sem descontar custos"
        lucroLiquido:
          type: number
          description: receitaVendas - custoTotal
        precoVendido:
          type: number
          description: "Preço de venda, sem descontos"
    RankingProdutos:
      type: object
      properties:
        quantidadeVendasTotais:
          type: integer
          format: int64
          description: Total de unidades vendidas
        ranking:
          type: array
          description: "Produtos com venda, do mais vendido para o menos vendido"
          items:
            $ref: "#/components/schemas/ProdutoRanking"
    RelatorioEventoResponse:
      type: object
      description: Relatório de um evento do tipo EVENTO
      properties:
        eventoId:
          type: integer
          format: int64
        nome:
          type: string
        tipoEvento:
          type: string
          enum:
          - EVENTO
          - REUNIAO
        status:
          $ref: "#/components/schemas/StatusResumo"
        parcial:
          type: boolean
          description: "true com o evento EM_ANDAMENTO: valores parciais"
        resumo:
          $ref: "#/components/schemas/ResumoFinanceiro"
        produtos:
          type: array
          description: "Todos os itens do cardápio, inclusive sem venda"
          items:
            $ref: "#/components/schemas/ProdutoRelatorio"
        custosAdicionais:
          type: array
          items:
            $ref: "#/components/schemas/CustoAdicionalRelatorio"
        caixa:
          $ref: "#/components/schemas/ResumoCaixaResponse"
        doacoes:
          $ref: "#/components/schemas/DoacoesRelatorio"
        movimentacoesEvento:
          type: array
          description: Consumo e perdas vinculados ao evento. Não existe registro
            separado de sobras
          items:
            $ref: "#/components/schemas/MovimentacaoRelatorio"
        produtosMaisVendidos:
          $ref: "#/components/schemas/RankingProdutos"
        vendasPorHora:
          $ref: "#/components/schemas/VendasPorHora"
    RelatorioResponse:
      description: "Relatório do evento. Para EVENTO retorna RelatorioEventoResponse;\
        \ para REUNIAO, RelatorioReuniaoResponse"
      oneOf:
      - $ref: "#/components/schemas/RelatorioEventoResponse"
      - $ref: "#/components/schemas/RelatorioReuniaoResponse"
    RelatorioReuniaoResponse:
      type: object
      description: "Relatório de uma REUNIAO: só custos, sem receita nem lucro"
      properties:
        eventoId:
          type: integer
          format: int64
        nome:
          type: string
        tipoEvento:
          type: string
          enum:
          - EVENTO
          - REUNIAO
        status:
          $ref: "#/components/schemas/StatusResumo"
        parcial:
          type: boolean
        resumo:
          $ref: "#/components/schemas/ResumoReuniao"
        itens:
          type: array
          description: "Compras, doações e consumo interno da reunião"
          items:
            $ref: "#/components/schemas/MovimentacaoRelatorio"
        custosAdicionais:
          type: array
          items:
            $ref: "#/components/schemas/CustoAdicionalRelatorio"
    ResumoFinanceiro:
      type: object
      properties:
        receitaVendas:
          type: number
          description: Soma do preço total das vendas não canceladas (já com descontos)
        descontosVendas:
          type: number
          description: Soma dos descontos dados na venda inteira. Informativo
        custoCompras:
          type: number
          description: Compras (REABASTECIMENTO) do evento
        custoFichasAgradecimento:
          type: number
          description: Soma dos valores de ficha de agradecimento
        custoIngredientes:
          type: number
          description: Soma do custo dos ingredientes dos itens PRODUZIDO
        totalCustosAdicionais:
          type: number
        doacoesEmDinheiro:
          type: number
        receitaTotal:
          type: number
          description: receitaVendas + doacoesEmDinheiro
        custoTotal:
          type: number
          description: custoCompras + custoFichasAgradecimento + custoIngredientes
            + totalCustosAdicionais
        lucro:
          type: number
          description: receitaTotal - custoTotal. Pode ser negativo
        vendas:
          type: integer
          format: int64
          description: Quantidade de vendas não canceladas
    ResumoReuniao:
      type: object
      properties:
        custoCompras:
          type: number
        custoConsumoInterno:
          type: number
        totalCustosAdicionais:
          type: number
        custoTotal:
          type: number
          description: custoCompras + custoConsumoInterno + totalCustosAdicionais
    VendaHora:
      type: object
      properties:
        hora:
          type: integer
          format: int32
          description: "Hora do dia, de 0 a 23"
          example: 14
        quantidadeVendas:
          type: integer
          format: int64
    VendasPorHora:
      type: object
      properties:
        quantidadeVendasTotais:
          type: integer
          format: int64
          description: Total de vendas não canceladas
        ranking:
          type: array
          description: "Quantidade de vendas por hora, em ordem crescente. Fuso America/Sao_Paulo"
          items:
            $ref: "#/components/schemas/VendaHora"
    PaginaResponseVendaHistoricoResponse:
      type: object
      description: Página de resultados. page começa em 0
      properties:
        itens:
          type: array
          description: Registros da página
          items:
            $ref: "#/components/schemas/VendaHistoricoResponse"
        page:
          type: integer
          format: int32
          description: "Índice da página, começando em zero"
          example: 0
        size:
          type: integer
          format: int32
          description: Tamanho da página
