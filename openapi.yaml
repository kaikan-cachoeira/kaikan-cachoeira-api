        page:
          type: integer
          format: int32
          description: "Índice da página, começando em zero"
          example: 0
        size:
          type: integer
          format: int32
          description: Tamanho da página
          example: 20
        totalItens:
          type: integer
          format: int64
          description: Total de registros
          example: 57
        totalPaginas:
          type: integer
          format: int32
          description: Total de páginas
          example: 3
    PaginaResponseDoacaoResponse:
      type: object
      description: Página de resultados. page começa em 0
      properties:
        itens:
          type: array
          description: Registros da página
          items:
            $ref: "#/components/schemas/DoacaoResponse"
        page:
          type: integer
          format: int32
          description: "Índice da página, começando em zero"
          example: 0
        size:
          type: integer
          format: int32
          description: Tamanho da página
          example: 20
        totalItens:
          type: integer
          format: int64
          description: Total de registros
          example: 57
        totalPaginas:
          type: integer
          format: int32
          description: Total de páginas
          example: 3
    ExclusaoCaixaResponse:
      type: object
      description: Resposta da exclusão de um lançamento de caixa.
      properties:
        resumo:
          $ref: "#/components/schemas/ResumoCaixaResponse"
