openapi: 3.1.0
info:
  title: Kaikan Cachoeira API
  description: "API de gestão de eventos, estoque, doações, vendas e caixa do Kaikan\
    \ de Cachoeira"
  version: 0.0.1
servers:
- url: http://localhost:8080
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Doações
  description: "Registro, edição e consulta das doações recebidas pela associação."
- name: Cardápio do evento
  description: "Produtos do cardápio de um evento: itens do estoque e itens produzidos\
    \ no evento."
- name: Eventos
  description: "Consulta, cadastro e atualização de eventos."
- name: Autenticação
  description: "Login, renovação de sessão e recuperação de senha. Rotas públicas,\
    \ sem JWT."
- name: Produtos
  description: "Consulta e gerenciamento de produtos do estoque, incluindo fotos."
- name: Categorias
  description: Consulta e gerenciamento das categorias de produtos.
- name: Custos do evento
  description: Consulta e gerenciamento dos custos de um evento.
- name: Movimentações de estoque
  description: Registro de movimentações e consulta de lotes e históricos do estoque.
- name: Vendas
  description: "Registro, cancelamento e histórico de vendas do evento em andamento."
- name: Descontos
  description: Desconto por unidade aplicado a produtos do cardápio durante o evento.
- name: Relatórios
  description: "Relatório individual por evento com vendas, custos, doações e lucro."
- name: Fiados
  description: Consulta e quitação de fichas vendidas a prazo.
- name: Caixa
  description: "Lançamentos de venda e devolução de fichas, formas de pagamento e\
    \ resumo do caixa do evento."
- name: Tipos de movimentação
  description: Consulta dos tipos de movimentação de estoque disponíveis.
paths:
  /produtos/{id}:
    get:
      tags:
      - Produtos
      summary: Busca produto por ID
      description: Retorna os dados de um produto específico.
      operationId: buscar
      parameters:
      - name: id
        in: path
        description: ID do produto
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Produto encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProdutoResponse"
        "404":
          description: Produto não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Recurso não encontrado:
                  description: Recurso não encontrado
                  value:
                    codigo: RECURSO_NAO_ENCONTRADO
                    mensagem: "Produto não encontrado: 123"
                    campos: []
    put:
      tags:
      - Produtos
      summary: Atualiza produto
      description: Atualiza os dados de um produto existente.
      operationId: atualizar
      parameters:
      - name: id
        in: path
        description: ID do produto
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Novos dados do produto
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProdutoRequest"
        required: true
      responses:
        "204":
          description: Produto atualizado
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Dados inválidos:
                  description: Dados inválidos
                  value:
                    codigo: VALIDACAO
                    mensagem: Dados inválidos
                    campos:
                    - campo: nome
                      mensagem: Nome é obrigatório
        "404":
          description: Produto não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Recurso não encontrado:
                  description: Recurso não encontrado
                  value:
                    codigo: RECURSO_NAO_ENCONTRADO
                    mensagem: "Produto não encontrado: 123"
                    campos: []
    delete:
      tags:
      - Produtos
      summary: Exclui produto
      description: "Exclui o produto indicado, caso exista."
      operationId: excluir
      parameters:
      - name: id
        in: path
        description: ID do produto
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Produto excluído
        "404":
          description: Produto não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Recurso não encontrado:
                  description: Recurso não encontrado
                  value:
                    codigo: RECURSO_NAO_ENCONTRADO
                    mensagem: "Produto não encontrado: 123"
                    campos: []
  /eventos/{id}:
    get:
      tags:
      - Eventos
      summary: Busca evento por ID
      description: |
        Retorna os detalhes de um evento específico, incluindo seu status,
        datas previstas e realizadas e resumo de produtos, vendas,
        valores vendidos e custos adicionais.
      operationId: buscar_1
      parameters:
      - name: id
        in: path
        description: ID do evento
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Evento encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventoDetalheResponse"
        "404":
          description: Evento não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventoDetalheResponse"
    put:
      tags:
      - Eventos
      summary: Atualiza evento
      description: |
        Atualiza os dados de um evento existente.
        A data e hora de encerramento previstas devem ser posteriores
        à data e hora de início previstas.
      operationId: atualizar_1
      parameters:
      - name: id
        in: path
        description: ID do evento
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Dados para atualização do evento
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventoRequest"
        required: true
      responses:
        "200":
          description: Evento atualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventoResponse"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Dados inválidos:
                  description: Dados inválidos
                  value:
                    codigo: VALIDACAO
                    mensagem: Dados inválidos
                    campos:
                    - campo: periodoValido
                      mensagem: A data de encerramento deve ser posterior à data de
                        início
        "404":
          description: Evento não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventoResponse"
        "409":
          description: Conflito com as regras de integridade dos eventos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Conflito de negócio:
                  description: Conflito de negócio
                  value:
                    codigo: CONFLITO_DADOS
                    mensagem: A operação viola uma regra de integridade dos dados.
                    campos: []
    delete:
      tags:
      - Eventos
      summary: Exclui evento
      description: |
        Exclui um evento que ainda não foi iniciado e que não possui
        vendas, doações ou movimentações de estoque.
        Os produtos do evento e os custos adicionais são removidos
        explicitamente na mesma transação.
      operationId: excluir_1
      parameters:
      - name: id
        in: path
        description: ID do evento
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Evento excluído
        "404":
          description: Evento não encontrado
        "409":
          description: Evento não pode ser excluído devido ao status ou a registros
            associados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Conflito de negócio:
                  description: Conflito de negócio
                  value:
                    codigo: CONFLITO_DADOS
                    mensagem: A operação viola uma regra de integridade dos dados.
                    campos: []
    patch:
      tags:
      - Eventos
      summary: Altera o status do evento
      description: |
        Transições: NAO_INICIADO → EM_ANDAMENTO (preenche iniciadoEm); EM_ANDAMENTO → ENCERRADO (preenche encerradoEm e
        grava os custos informados na mesma transação); EM_ANDAMENTO → NAO_INICIADO (desfazer início, só sem vendas
        nem lançamentos de caixa); ENCERRADO → EM_ANDAMENTO (reabertura; preserva dados e iniciadoEm).
        Só um evento do tipo EVENTO pode estar em andamento por vez. O campo custos só é aceito ao encerrar.
      operationId: alterarStatus
      parameters:
      - name: id
        in: path
        description: ID do evento
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Id do novo status e custos adicionais (opcional)
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlteracaoStatusEventoRequest"
        required: true
      responses:
        "204":
          description: Status alterado
        "400":
          description: "Status inválido, custos fora do encerramento ou custo invá\
            lido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Requisição inválida:
                  description: Requisição inválida
                  value:
                    codigo: REQUISICAO_INVALIDA
                    mensagem: Corpo da requisição inválido ou malformado
                    campos: []
        "404":
          description: Evento não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Recurso não encontrado:
                  description: Recurso não encontrado
                  value:
                    codigo: RECURSO_NAO_ENCONTRADO
                    mensagem: "Evento não encontrado: 123"
                    campos: []
        "409":
          description: "Transição inválida, outro evento em andamento ou desfazer\
            \ início bloqueado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Conflito de negócio:
                  description: Conflito de negócio
                  value:
                    codigo: EVENTO_EM_ANDAMENTO_EXISTENTE
                    mensagem: Já existe um evento em andamento.
                    campos: []
  /eventos/{eventoId}/produtos/{produtoEventoId}:
    put:
      tags:
      - Cardápio do evento
      summary: Atualiza item do cardápio
      description: |
        Só com o evento NAO_INICIADO. Itens ESTOQUE editam precoVenda e quantidadePrevista; itens PRODUZIDO
        editam nome, descrição, categoria, precoVenda e custoTotalIngredientes. Exige EVENTOS_MENU.
      operationId: atualizar_2
      parameters:
      - name: eventoId
        in: path
        description: ID do evento
        required: true
        schema:
          type: integer
          format: int64
      - name: produtoEventoId
        in: path
        description: ID do item do cardápio
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Novos dados do item
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProdutoEventoRequest"
        required: true
      responses:
        "200":
          description: Item atualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProdutoEventoResponse"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Dados inválidos:
                  description: Dados inválidos
                  value:
                    codigo: VALIDACAO
                    mensagem: Dados inválidos
                    campos:
                    - campo: origem
                      mensagem: Origem deve ser ESTOQUE ou PRODUZIDO
        "404":
          description: Item não encontrado neste evento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Recurso não encontrado:
                  description: Recurso não encontrado
                  value:
                    codigo: RECURSO_NAO_ENCONTRADO
                    mensagem: "Evento não encontrado: 123"
                    campos: []
        "409":
          description: Evento já iniciado ou nome duplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Conflito de negócio:
                  description: Conflito de negócio
                  value:
                    codigo: EVENTO_JA_INICIADO
                    mensagem: Só é possível alterar com o evento no status NAO_INICIADO.
                    campos: []
    delete:
      tags:
      - Cardápio do evento
      summary: Remove item do cardápio
      description: Só com o evento NAO_INICIADO e se o item nunca foi vendido. Exige
        EVENTOS_MENU.
      operationId: remover
      parameters:
      - name: eventoId
        in: path
        description: ID do evento
        required: true
        schema:
          type: integer
          format: int64
      - name: produtoEventoId
        in: path
        description: ID do item do cardápio
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Item removido
        "404":
          description: Item não encontrado neste evento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Recurso não encontrado:
                  description: Recurso não encontrado
                  value:
                    codigo: RECURSO_NAO_ENCONTRADO
                    mensagem: "Evento não encontrado: 123"
                    campos: []
        "409":
          description: Evento já iniciado ou item já vendido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Conflito de negócio:
                  description: Conflito de negócio
                  value:
                    codigo: EVENTO_JA_INICIADO
                    mensagem: Só é possível alterar com o evento no status NAO_INICIADO.
                    campos: []
  /eventos/{eventoId}/custos/{custoId}:
    put:
      tags:
      - Custos do evento
      summary: Atualiza custo do evento
      description: Atualiza um custo adicional de um evento em andamento ou encerrado.
      operationId: atualizarCustoEvento
      parameters:
      - name: eventoId
        in: path
        description: ID do evento
        required: true
        schema:
          type: integer
          format: int64
      - name: custoId
        in: path
        description: ID do custo
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Novos dados do custo
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustoEventoRequest"
        required: true
      responses:
        "200":
          description: Custo atualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CustoEventoResponse"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Dados inválidos:
                  description: Dados inválidos
                  value:
                    codigo: VALIDACAO
                    mensagem: Dados inválidos
                    campos:
                    - campo: valor
                      mensagem: O valor deve ser maior que zero
        "404":
          description: Evento ou custo não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Evento não encontrado:
                  description: Evento não encontrado
                  value:
                    codigo: RECURSO_NAO_ENCONTRADO
                    mensagem: "Evento não encontrado: 123"
                    campos: []
                Custo não encontrado:
                  description: Custo não encontrado
                  value:
                    codigo: RECURSO_NAO_ENCONTRADO
                    mensagem: "Custo do evento não encontrado: 456"
                    campos: []
        "409":
          description: Status do evento não permite atualizar custos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Status inválido:
                  description: Status inválido
                  value:
                    codigo: CUSTO_EVENTO_STATUS_INVALIDO
                    mensagem: Só é possível adicionar ou atualizar custos de eventos
                      em andamento ou encerrados.
                    campos: []
    delete:
      tags:
      - Custos do evento
      summary: Remove custo do evento
      description: Remove um custo adicional do evento informado.
      operationId: removerCustoEvento
      parameters:
      - name: eventoId
        in: path
        description: ID do evento
        required: true
        schema:
          type: integer
          format: int64
      - name: custoId
        in: path
        description: ID do custo
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Custo removido
        "404":
          description: Evento ou custo não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Evento não encontrado:
                  description: Evento não encontrado
                  value:
                    codigo: RECURSO_NAO_ENCONTRADO
                    mensagem: "Evento não encontrado: 123"
                    campos: []
                Custo não encontrado:
                  description: Custo não encontrado
                  value:
                    codigo: RECURSO_NAO_ENCONTRADO
                    mensagem: "Custo do evento não encontrado: 456"
                    campos: []
  /doacoes/{id}:
    put:
      tags:
      - Doações
      summary: Atualiza doação
      description: |
        Atualiza os dados de uma doação em qualquer status do evento.
        O tipo e o produto (no reabastecimento) não podem ser alterados.
        Quando a quantidade de um reabastecimento muda, o lote e a movimentação DOACAO são ajustados.
      operationId: atualizar_3
      parameters:
      - name: id
        in: path
        description: ID da doação
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        description: Dados da doação
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DoacaoRequest"
        required: true
      responses:
        "204":
          description: Doação atualizada
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Dados inválidos:
                  description: Dados inválidos
                  value:
                    codigo: VALIDACAO
                    mensagem: Dados inválidos
                    campos:
                    - campo: tipo
                      mensagem: Tipo de doação inválido
        "404":
          description: Doação não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Recurso não encontrado:
                  description: Recurso não encontrado
                  value:
                    codigo: RECURSO_NAO_ENCONTRADO
                    mensagem: "Doação não encontrado: 123"
                    campos: []
        "409":
          description: Quantidade menor que a já consumida do lote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Conflito de negócio:
                  description: Conflito de negócio
                  value:
                    codigo: CONFLITO_DADOS
                    mensagem: A operação viola uma regra de integridade dos dados.
                    campos: []
  /categorias/{id}:
    put:
      tags:
      - Categorias
      summary: Atualiza categoria
      description: Atualiza os dados de uma categoria existente.
      operationId: atualizar_4
      parameters:
      - name: id
        in: path
        description: ID da categoria
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        description: Novos dados da categoria
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoriaRequest"
        required: true
      responses:
        "200":
          description: Categoria atualizada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CategoriaResponse"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Dados inválidos:
                  description: Dados inválidos
                  value:
                    codigo: VALIDACAO
                    mensagem: Dados inválidos
                    campos:
                    - campo: nome
                      mensagem: Nome é obrigatório
        "409":
          description: Já existe uma categoria com este nome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Categoria duplicada:
                  description: Categoria duplicada
                  value:
                    codigo: CATEGORIA_DUPLICADA
                    mensagem: Já existe uma categoria com este nome.
                    campos: []
        "404":
          description: Categoria não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Recurso não encontrado:
                  description: Recurso não encontrado
                  value:
                    codigo: RECURSO_NAO_ENCONTRADO
                    mensagem: "Categoria não encontrada: 123"
                    campos: []
    delete:
      tags:
      - Categorias
      summary: Exclui categoria
      description: Solicita a exclusão da categoria indicada.
      operationId: excluir_2
      parameters:
      - name: id
        in: path
        description: ID da categoria
        required: true
        schema:
          type: integer
          format: int32
      responses:
        "204":
          description: Categoria excluída
        "404":
          description: Categoria não encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Recurso não encontrado:
                  description: Recurso não encontrado
                  value:
                    codigo: RECURSO_NAO_ENCONTRADO
                    mensagem: "Categoria não encontrada: 123"
                    campos: []
        "409":
          description: Categoria possui produtos vinculados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Categoria em uso:
                  description: Categoria em uso
                  value:
                    codigo: CATEGORIA_COM_PRODUTOS
                    mensagem: Não é possível excluir esta categoria porque existem
                      produtos vinculados a ela.
                    campos: []
  /produtos:
    get:
      tags:
      - Produtos
      summary: Lista produtos
      description: |
        Retorna os produtos cadastrados, permitindo aplicar filtros opcionais
        por texto, categorias e situação de estoque abaixo do mínimo.
      operationId: listar
      parameters:
      - name: q
        in: query
        description: Texto para pesquisa de produtos
        required: false
        schema:
          type: string
      - name: categoriaId
        in: query
        description: IDs das categorias para filtrar os produtos
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      - name: abaixoDoMinimo
        in: query
        description: Filtra produtos abaixo do estoque mínimo
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: Lista de produtos retornada
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProdutoResponse"
    post:
      tags:
      - Produtos
      summary: Cadastra produto
      description: Cria um produto a partir dos dados informados.
      operationId: criar
      requestBody:
        description: Dados para cadastro do produto
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProdutoRequest"
        required: true
      responses:
        "201":
          description: Produto criado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProdutoResponse"
        "400":
          description: Dados inválidos
          content:
            application/json:
              schema:
