          items:
            $ref: "#/components/schemas/ItemVendaDetalheResponse"
        desconto:
          type: number
          description: Desconto aplicado ao valor total da venda.
        precoTotal:
          type: number
          description: Valor total cobrado pela venda.
        cancelada:
          type: boolean
          description: Indica se a venda foi cancelada.
        canceladaEm:
          type: string
          format: date-time
          description: Data e hora do cancelamento em ISO-8601; nulo se a venda não
            foi cancelada.
    CaixaResponse:
      type: object
      description: "Resposta da consulta do caixa, com resumo financeiro e lançamentos\
