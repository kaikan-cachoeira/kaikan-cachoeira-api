          description: ID do tipo de movimentação manual (GET /tipos-movimentacao).
            Tipos gerados pelo sistema são rejeitados
          example: 1
        quantidade:
          type: integer
          format: int32
          description: Quantidade sempre positiva; o sentido vem do tipo
