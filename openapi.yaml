      - quantidade
      - tipoMovimentacaoId
    MovimentacaoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        estoqueId:
          type: integer
          format: int64
          description: Lote afetado pela movimentação
        tipo:
          type: string
          description: Código do tipo
          example: REABASTECIMENTO
        quantidade:
          type: integer
          format: int32
