          example: 20.0
          minimum: 0
      required:
      - doador
      - eventoId
      - tipo
    CategoriaRequest:
      type: object
      properties:
        nome:
          type: string
          description: "Nome da categoria, único sem diferenciar maiúsculas. Espaç\
            os externos são removidos"
          example: BEBIDA
          maxLength: 100
          minLength: 0
        descricao:
          type: string
          description: Descrição opcional
          example: Todos os produtos classificados como bebida
          maxLength: 255
          minLength: 0
      required:
      - nome
    CategoriaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
          example: 1
        nome:
          type: string
          example: BEBIDA
        descricao:
          type:
          - string
          - "null"
    CategoriaResumo:
      type: object
      description: Categoria resumida do produto
