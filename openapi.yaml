        custoTotal:
          type: number
          description: Custo do lote movimentado
        custoUnitario:
          type: number
        eventoId:
          type:
          - integer
          - "null"
          format: int64
        observacoes:
          type:
          - string
          - "null"
        criadoEm:
          type: string
          format: date-time
    MovimentacaoResultadoResponse:
      type: object
