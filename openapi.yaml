      responses:
        "200":
          description: Fiados retornados
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FiadoResponse"
        "400":
          description: Situação inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Situação inválida:
                  description: Situação inválida
                  value:
                    codigo: VALIDACAO
                    mensagem: Dados inválidos
                    campos:
                    - campo: situacao
                      mensagem: Situação deve ser pendente ou quitado
        "404":
          description: Evento não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Recurso não encontrado:
                  description: Recurso não encontrado
                  value:
                    codigo: RECURSO_NAO_ENCONTRADO
                    mensagem: "Evento não encontrado: 123"
                    campos: []
  /estoques/{id}/movimentacoes:
    get:
      tags:
      - Movimentações de estoque
      summary: Consulta histórico de movimentações de um lote
      description: |
        Retorna o histórico paginado de movimentações do lote indicado.
        A paginação usa índice iniciado em zero.
      operationId: historicoDoLote
      parameters:
      - name: id
        in: path
        description: ID do lote de estoque
        required: true
        schema:
          type: integer
          format: int64
      - name: page
        in: query
        description: "Índice da página, começando em zero"
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        description: Quantidade de registros por página (de 1 a 100)
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      responses:
        "200":
          description: Histórico do lote retornado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PaginaResponseMovimentacaoResponse"
        "400":
          description: Parâmetros de consulta ou paginação inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Parâmetro inválido:
                  description: Parâmetro inválido
                  value:
                    codigo: VALIDACAO
                    mensagem: Dados inválidos
                    campos:
                    - campo: page
                      mensagem: deve ser maior ou igual a 0
        "404":
          description: Lote não encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Recurso não encontrado:
                  description: Recurso não encontrado
                  value:
                    codigo: RECURSO_NAO_ENCONTRADO
                    mensagem: "Lote não encontrado: 123"
                    campos: []
  /eventos/{eventoId}/caixa/{lancamentoId}:
    delete:
      tags:
      - Caixa
      summary: Exclui lançamento
      description: |
        Corrige registros acidentais (exclusão física), apenas com o evento em andamento.
        Excluir venda de fichas fiada remove o fiado (se pendente); excluir uma quitação reabre o fiado.
        Exige CAIXA_MENU.
      operationId: excluir_3
      parameters:
      - name: eventoId
        in: path
        description: ID do evento
        required: true
        schema:
          type: integer
          format: int64
      - name: lancamentoId
        in: path
        description: ID do lançamento
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Lançamento excluído; retorna o resumo atualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ExclusaoCaixaResponse"
        "404":
          description: Lançamento não encontrado neste evento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Recurso não encontrado:
                  description: Recurso não encontrado
                  value:
                    codigo: RECURSO_NAO_ENCONTRADO
                    mensagem: "Lançamento não encontrado: 123"
                    campos: []
        "409":
          description: Evento não está em andamento ou fiado já quitado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErroResponse"
              examples:
                Conflito de negócio:
                  description: Conflito de negócio
                  value:
                    codigo: FIADO_JA_QUITADO
                    mensagem: O fiado já está quitado.
                    campos: []
components:
  schemas:
    ProdutoRequest:
      type: object
      properties:
        nome:
          type: string
          description: "Nome do produto. Único, sem diferenciar maiúsculas"
          example: Coca-Cola 350ml
          maxLength: 150
          minLength: 0
        descricao:
          type: string
          description: Descrição opcional
          example: Lata 350ml
        categoriaId:
          type: integer
          format: int32
          description: ID da categoria (opcional)
          example: 1
        estoqueMinimo:
          type: integer
          format: int32
          description: Quantidade mínima em estoque (opcional). Abaixo ou igual a
            ela o produto aparece como estoque baixo
          example: 10
          minimum: 0
      required:
      - nome
    CampoErro:
      type: object
      description: Erro de validação em um campo
      properties:
        campo:
          type: string
          description: Nome do campo
          example: valor
        mensagem:
          type: string
          description: Mensagem do erro
          example: Valor deve ser maior que 0
    ErroResponse:
      type: object
      description: Corpo padrão de erro
      properties:
        codigo:
          type: string
          description: Código estável do erro
          example: SALDO_INSUFICIENTE
        mensagem:
          type: string
          description: Mensagem legível
          example: "Saldo insuficiente. Disponível: 2."
        campos:
          type: array
          description: Erros por campo (vazio quando não é validação)
          items:
            $ref: "#/components/schemas/CampoErro"
    EventoRequest:
      type: object
      properties:
        nome:
          type: string
          description: Nome do evento. Espaços externos são removidos
          example: Undoukai 2026
          maxLength: 150
          minLength: 0
        observacoes:
          type: string
          description: Observações (opcional)
        tipoEvento:
          type: string
          description: EVENTO (com cardápio e vendas) ou REUNIAO (só despesa)
          enum:
          - EVENTO
          - REUNIAO
          example: EVENTO
        dataHoraInicio:
          type: string
          format: date-time
          description: Início previsto (ISO-8601)
          example: 2026-11-01T09:00:00Z
        dataHoraEncerramento:
          type: string
          format: date-time
          description: "Encerramento previsto (ISO-8601). Deve ser posterior ao iní\
            cio; se não for, o erro vem no campo periodoValido"
          example: 2026-11-01T17:00:00Z
      required:
      - dataHoraEncerramento
      - dataHoraInicio
      - nome
      - tipoEvento
    EventoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        tipoEvento:
          type: string
          enum:
          - EVENTO
          - REUNIAO
        status:
          $ref: "#/components/schemas/StatusResumo"
        dataHoraInicio:
          type: string
          format: date-time
          description: Início previsto
        dataHoraEncerramento:
          type: string
          format: date-time
          description: Encerramento previsto
        iniciadoEm:
          type:
          - string
          - "null"
          format: date-time
          description: Quando o evento foi iniciado de fato
        encerradoEm:
          type:
          - string
          - "null"
          format: date-time
          description: Encerramento vigente. Limpo ao reabrir
    StatusResumo:
      type: object
      properties:
        id:
          type: integer
          format: int32
          description: "1 = NAO_INICIADO, 2 = EM_ANDAMENTO, 3 = ENCERRADO"
          example: 2
        codigo:
          type: string
          example: EM_ANDAMENTO
        descricao:
          type: string
          example: Evento em andamento
    ProdutoEventoRequest:
      type: object
      properties:
        origem:
          type: string
          description: "ESTOQUE (produto cadastrado) ou PRODUZIDO (feito no evento,\
            \ sem estoque)"
          enum:
          - ESTOQUE
          - PRODUZIDO
        produtoId:
          type: integer
          format: int64
          description: Obrigatório em ESTOQUE; não usado em PRODUZIDO
          example: 3
        nome:
          type: string
          description: "Obrigatório em PRODUZIDO, único no evento. Em ESTOQUE vem\
            \ do produto"
          example: Tempurá
          maxLength: 150
          minLength: 0
        descricao:
          type: string
          description: Só em PRODUZIDO. Em ESTOQUE vem do produto
        categoria:
          type: string
          description: "Só em PRODUZIDO, opcional. Deve ser o nome de uma categoria\
            \ existente"
          example: COMIDA
          maxLength: 100
          minLength: 0
        precoVenda:
          type: number
          description: Preço de venda unitário
          example: 10.0
          minimum: 0
        quantidadePrevista:
          type: integer
          format: int32
          description: Obrigatório em ESTOQUE; não usado em PRODUZIDO
          example: 20
          minimum: 0
        custoTotalIngredientes:
          type: number
          description: "Obrigatório em PRODUZIDO: custo total dos ingredientes no\
            \ evento"
          example: 40.0
          minimum: 0
      required:
      - origem
      - precoVenda
    ProdutoEventoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        origem:
          type: string
          enum:
          - ESTOQUE
          - PRODUZIDO
        produtoId:
          type:
          - integer
          - "null"
          format: int64
          description: Nulo em itens PRODUZIDO
        nome:
          type: string
          description: Snapshot do nome
        descricao:
          type:
          - string
          - "null"
          description: Snapshot da descrição
        categoria:
          type:
          - string
          - "null"
          description: Snapshot do nome da categoria
          example: COMIDA
        fotoUrl:
          type:
          - string
          - "null"
        precoVenda:
          type: number
          description: "Preço de venda, sem desconto"
        desconto:
          type: number
          description: Desconto por unidade. 0 quando não há desconto
        descontoAplicadoEm:
          type:
          - string
          - "null"
          format: date-time
        precoComDesconto:
          type: number
          description: precoVenda - desconto
        quantidadePrevista:
          type:
          - integer
          - "null"
          format: int32
          description: Nulo em itens PRODUZIDO
        quantidadeVendida:
          type: integer
          format: int32
          description: Soma das vendas não canceladas
        restantePrevisto:
          type:
          - integer
          - "null"
          format: int32
          description: "quantidadePrevista - quantidadeVendida, sem piso em 0 (pode\
            \ ficar negativo). Nulo em PRODUZIDO"
        custoTotalIngredientes:
          type:
          - number
          - "null"
          description: Só em itens PRODUZIDO
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time
    CustoEventoRequest:
      type: object
      properties:
        nome:
          type: string
          description: Nome do custo
          example: Limpeza
          maxLength: 150
          minLength: 1
        descricao:
          type: string
          description: Descrição (opcional)
          example: Faxineira contratada
          maxLength: 255
          minLength: 0
        valor:
          type: number
          description: "Valor, maior que zero"
          example: 120.0
          minimum: 0
      required:
      - nome
      - valor
    CustoEventoResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string
        descricao:
          type: string
        valor:
          type: number
        criadoEm:
          type: string
          format: date-time
        atualizadoEm:
          type: string
          format: date-time
    DoacaoRequest:
      type: object
      properties:
        eventoId:
          type: integer
          format: int64
          description: Evento da doação. Deve existir e não estar ENCERRADO
          example: 1
        tipo:
          type: string
          description: "Tipo, sem diferenciar maiúsculas. Imutável na edição"
          enum:
          - dinheiro
          - produto
          - reabastecimento
          example: dinheiro
          minLength: 1
        valor:
          type: number
          description: "Só em dinheiro: valor maior que 0"
          example: 50.0
        formaPagamento:
          type: string
          description: "Só em dinheiro: PIX, DEBITO, CREDITO ou DINHEIRO"
          example: PIX
        produtoId:
          type: integer
          format: int64
          description: "Só em reabastecimento: produto ativo do estoque. Imutável\
            \ na edição"
          example: 3
        nome:
          type: string
          description: "Só em produto: descrição do item. Em reabastecimento é preenchido\
            \ pelo nome do produto"
          example: Bolo de cenoura
          maxLength: 150
          minLength: 0
        quantidade:
          type: integer
          format: int32
          description: "Só em reabastecimento: quantidade maior que 0. Cria lote sem\
            \ custo"
          example: 12
        doador:
          type: string
          description: Nome do doador (texto livre)
          example: Maria Silva
          maxLength: 150
          minLength: 0
        valorFicha:
          type: number
          description: Valor da ficha de agradecimento (opcional). Entra como custo
