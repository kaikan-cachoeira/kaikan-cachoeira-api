# Banco de dados
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.show-sql=false

# Swagger / springdoc
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# JWT
app.security.jwt.secret=${JWT_SECRET}

# CORS
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Email
app.email.provider=resend
app.email.remetente=no-reply@seudominio.com.br
app.email.front-url=${FRONT_URL}
app.email.resend.api-key=${RESEND_API_KEY}
app.email.resend.connect-timeout=5s
app.email.resend.read-timeout=10s