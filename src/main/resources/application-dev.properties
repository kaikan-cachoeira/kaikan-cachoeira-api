# Banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/kaikan
spring.datasource.username=kaikan
spring.datasource.password=kaikan

# JPA / Hibernate
spring.jpa.show-sql=true

# Swagger / springdoc
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# JWT
app.security.jwt.secret=exemplo-jwt-secret-de-32-bytes-para-desenvolvimento

# CORS
app.security.cors.allowed-origins=http://localhost:3000,http://localhost:5173