# Banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/kaikan
spring.datasource.username=kaikan
spring.datasource.password=kaikan

# JPA / Hibernate
spring.jpa.show-sql=true

# Flyway
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.flyway=DEBUG

# Swagger / springdoc
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# JWT
app.security.jwt.secret=exemplo-jwt-secret-de-32-bytes-para-desenvolvimento

# CORS
app.security.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Email
app.email.provider=smtp
app.email.remetente=no-reply@kaikan.local
app.email.front-url=http://localhost:5173
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000