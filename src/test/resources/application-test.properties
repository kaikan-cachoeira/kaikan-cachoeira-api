# JWT
app.security.jwt.secret=segredo-de-teste-com-pelo-menos-32-bytes-ok
app.security.jwt.issuer=kaikan-cachoeira-api-test
app.security.jwt.access-token-ttl=15m
app.security.jwt.refresh-token-ttl=7d

# Token de recuperação de senha
app.security.senha.token-senha-ttl=1h

# CORS
app.security.cors.allowed-origins=http://localhost:5173

# E-mail (SMTP só para o contexto subir; os testes mockam o envio)
app.email.provider=smtp
app.email.front-url=http://localhost:5173
app.email.remetente=no-reply@kaikan.test
spring.mail.host=localhost
spring.mail.port=1025

# Banco: o schema vem só das migrations Flyway
spring.jpa.hibernate.ddl-auto=validate